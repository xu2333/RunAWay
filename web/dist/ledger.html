<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>RunAWay · 偏好战绩</title><link rel="stylesheet" href="./style.css"><script type="module" src="./ledger.mjs"></script></head><body><header><a href="./">RunAWay</a></header><main><h1>这条偏好，灵过几次？</h1><p>从<a href="./timeline.html">偏好时间线</a>下载私有事件档案和 portable.json，再从<a href="./choices.html">分身试镜</a>下载实际使用同一 prompt 的私有记录。文件只在本页读取。</p><p>战绩是你明确归因的使用记录，不是准确率。撤回和当前要求优先；纠正需要复核，不会偷偷改写 prompt。</p><div id="notice" role="status"></div><section class="panel"><label>事件档案<input id="artifact" type="file" accept=".json"></label><label>portable.json<input id="portable" type="file" accept=".json"></label><label>试镜私有记录<input id="trial" type="file" accept=".json"></label><label>具体偏好<select id="preference"></select></label><label>这条偏好的结果<select id="outcome"><option value="unresolved">尚不能判断</option><option value="adopted">被我采纳</option><option value="corrected">被我纠正</option></select></label><label><input id="attributed" type="checkbox">我确认本次结果可以归因于所选偏好，并核对了适用条件</label><button id="add" disabled>记入本地账本</button></section><section class="panel"><h2>当前版本的战绩</h2><p>只统计相同档案、偏好内容版本；新版本从零开始。重复导入不加分，冲突标为未决。虚构示例单列。</p><div id="rows"></div><label>合并以前下载的账本<input id="restore" type="file" accept=".json"></label><button id="download" disabled>下载私有账本</button><button id="clear">清空本页</button><p>刷新会清空未下载记录。账本含原始材料和纠正，请勿公开上传。</p></section></main></body></html>
