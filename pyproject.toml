[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runaway-taste"
version = "0.31.1"
description = "Turn experiences into a portable taste prompt."
requires-python = ">=3.9"
readme = "QUICKSTART.md"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
evaluation = ["llama-cpp-python==0.3.36", "numpy>=1.26,<3"]

[project.scripts]
runaway = "runaway.cli:main"

[tool.setuptools]
packages = ["runaway"]

[tool.setuptools.package-data]
runaway = ["assets/demo.json"]
