name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python3.9 has no setup-python build for the new ubuntu-latest26.04 image.
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          # ARM hosted capacity prevented jobs from starting; keep macOS checks
          # on the standard Intel pool. See docs/ci.md for evidence and limits.
          - os: macos-15-intel
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and CLI checks (no model service)
        run: python scripts/frozen_history.py tests
      - name: Browser logic and Python artifact interoperability
        run: node --test tests/*.test.mjs
      - name: Reproduce source-support synthetic benchmark (no model calls)
        run: python scripts/frozen_history.py run benchmarks/support-extraction-v1/run.py check-observed
      - name: Reproduce coverage-reader study and failed-call accounting
        run: python scripts/frozen_history.py run benchmarks/support-extraction-v1/check_coverage.py
      - name: Reproduce counterbalanced source-layout study
        run: python scripts/frozen_history.py run benchmarks/support-extraction-v1/check_layout.py
      - name: Reproduce fresh synthetic end-to-end scope study
        run: python scripts/frozen_history.py run benchmarks/fresh-boundary-v1/check.py
      - name: Reproduce long-history whole-card budget stress study
        run: python scripts/frozen_history.py run benchmarks/long-trajectory-v1/check.py
      - name: Reproduce independent frozen 384-card revalidation
        run: python scripts/frozen_history.py run benchmarks/frozen384-v1/check.py
      - name: Reproduce power-guarded 384-card validation
        run: python scripts/frozen_history.py run benchmarks/guarded384-v1/check.py
      - name: Reproduce new-person latent-rule transfer and uncertainty
        run: python scripts/frozen_history.py run benchmarks/latent-transfer-v1/check.py
      - name: Reproduce standalone decoder-removal ablation
        run: python scripts/frozen_history.py run benchmarks/standalone-latent-v1/check.py
      - name: Preserve measured v2 extraction and portable output (consumed data, no calls)
        run: python scripts/frozen_history.py run benchmarks/source-constraints-v2/check.py
      - name: Replay naturalistic full-history controls (consumed data, no calls)
        run: python scripts/frozen_history.py run benchmarks/natural-controls-v1/check.py
      - name: Replay naturalistic short-card compression (consumed data, no calls)
        run: python scripts/frozen_history.py run benchmarks/natural-compression-v1/check.py
      - name: Replay heterogeneous budget frontier and skipped slots (no calls)
        run: python scripts/frozen_history.py run benchmarks/heterogeneous-frontier-v1/check.py
      - name: Replay paired grouped/default whole512 comparison (no calls)
        run: |
          python scripts/frozen_history.py run benchmarks/grouped-comparison-v1/check.py
          python -m unittest discover -s benchmarks/grouped-comparison-v1/prototype -p 'test_*.py' -v
      - name: Check source-only coverage pipeline prototype (no model calls)
        run: python -m unittest discover -s benchmarks/source-coverage-pipeline-v1 -p 'test_*.py' -v
      - name: Replay source inventory audit and compression comparison (no model calls)
        run: python scripts/frozen_history.py run benchmarks/source-coverage-comparison-v1/check.py
      - name: Check separate source-review index prototype (no model calls)
        run: python -m unittest discover -s benchmarks/source-coverage-review-v2 -p 'test_*.py' -v
      - name: Replay whole1536 source-review comparison (no model calls)
        run: python scripts/frozen_history.py run benchmarks/source-review-comparison-v1/check.py
      - name: Replay post-ceiling losses and unresolved references (no model calls)
        run: python scripts/frozen_history.py run benchmarks/regression-progress-v1/check.py
      - name: Calibrate decision-target and execution boundaries (no model calls)
        run: python scripts/frozen_history.py run benchmarks/decision-targets-v1/check.py
      - name: Replay measured decision-target comparison (no model calls)
        run: python scripts/frozen_history.py run benchmarks/decision-targets-v1/measured.py
      - name: Replay lower-budget extraction stability and invalid products (no calls)
        run: python scripts/frozen_history.py run scripts/replay_compression_stability.py
      - name: Replay remaining-world losses and unscored disputed references (no calls)
        run: python scripts/frozen_history.py run scripts/replay_remaining_world_frontier.py
      - name: Verify all232source-bound observations without claiming a pass
        run: python scripts/frozen_history.py run scripts/replay_regression_inventory.py
      - name: Replay owned-condition losses, failed capacity and expired readers (no calls)
        run: python scripts/frozen_history.py run scripts/replay_owned_conditions.py
      - name: Replay object-table budget failures and identical-reader instability (no calls)
        run: python scripts/frozen_history.py run scripts/replay_object_table_probe.py
      - name: Replay budget-aware request failures and offline lossless dense layouts (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_budgeted_table_probe.py
          python scripts/frozen_history.py run benchmarks/owned-dense-v1/evidence.py
      - name: Replay fixed-parent compact layout interpretation (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_dense_layout_probe.py
          python scripts/frozen_history.py run scripts/replay_action_revision_pilot.py
          python scripts/frozen_history.py run scripts/replay_action_revision_stability.py
          python scripts/frozen_history.py run scripts/replay_action_policy_comparison.py
      - name: Check annotated order-target conservation and recorded preparation confound
        run: python scripts/frozen_history.py run benchmarks/order-targets-v1/evidence.py
      - name: Replay fixed-view order-target reading (no calls)
        run: python scripts/frozen_history.py run scripts/replay_order_target_reads.py
      - name: Replay source-only order generation and separate erasure controls (no calls)
        run: python scripts/frozen_history.py run scripts/replay_source_order_probe.py
      - name: Replay two-source order-annotation collateral regression (no calls)
        run: python scripts/frozen_history.py run scripts/replay_source_order_regression.py
      - name: Replay new-source card and matched-tail losses (no calls)
        run: python scripts/frozen_history.py run scripts/replay_fresh_source_contrast.py
      - name: Replay fixed-parent name-marker negative result (no calls)
        run: python scripts/frozen_history.py run scripts/replay_named_target_diagnostic.py
      - name: Replay unchanged-memory task-contract comparison (no calls)
        run: python scripts/frozen_history.py run scripts/replay_question_contract_diagnostic.py
      - name: Verify source-grounded task scenarios and offline fixture calibration (no calls)
        run: python scripts/frozen_history.py run benchmarks/task-scenarios-v1/check.py
      - name: Verify controlled long-source task protocol inputs (no calls)
        run: python scripts/frozen_history.py run benchmarks/long-task-probe-v1/check.py
      - name: Replay closed long-source task compression result (no calls)
        run: python scripts/frozen_history.py run scripts/replay_long_task_probe.py
      - name: Verify source-licensed inference and uncertainty protocol (no calls)
        run: python scripts/frozen_history.py run benchmarks/epistemic-transfer-v1/check.py
      - name: Replay source-licensed full controls and extraction timeout (no calls)
        run: python scripts/frozen_history.py run scripts/replay_epistemic_transfer.py
      - name: Replay one-extraction readiness and unused object incidence (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_extraction_readiness.py
          python scripts/frozen_history.py run scripts/audit_graph_object_coverage.py benchmarks/extraction-readiness-v1/measured.synthetic.json
          python scripts/frozen_history.py run scripts/check_graph_object_inventory.py
      - name: Replay fixed-card known-domain losses and proxy invariance (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_fixed_card_fidelity.py
          python scripts/frozen_history.py run scripts/check_object_incidence_invariance.py
      - name: Verify synthetic catalogue source
        run: python scripts/build_catalog.py --check
      - name: Replay stopped generic source-coverage comparison (no calls)
        run: python scripts/frozen_history.py run scripts/replay_object_coverage_comparison.py
      - name: Replay completed three-card fidelity diagnostic (no calls)
        run: python scripts/frozen_history.py run scripts/replay_coverage_fixed_views.py
      - name: Replay finite source-coverage extraction repeat (no calls)
        run: python scripts/frozen_history.py run scripts/replay_source_coverage_repeat.py
      - name: Replay ambiguous-source repeat and known-to-unknown loss (no calls)
        run: python scripts/frozen_history.py run scripts/replay_ambiguous_source_repeat.py
      - name: Replay remaining source worlds and complete fixed grid (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_remaining_source_repeat.py
          python scripts/frozen_history.py run scripts/replay_source_coverage_grid.py --check
      - name: Exercise explicit-method memory bridge without a model
        run: python scripts/frozen_history.py run scripts/memory.py demo --out memory-bridge-demo
      - name: Replay rejected source review and preserved missing cases (no calls)
        run: python scripts/frozen_history.py run scripts/replay_source_review_diagnostic.py
      - name: Replay source-ID recovery and citation-subset limitation (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_source_id_review.py
          python scripts/frozen_history.py run scripts/check_source_reference_witness.py
          python scripts/frozen_history.py run scripts/review_memory.py demo --out source-id-review-demo
      - name: Replay paired review availability failures and recovery (no calls)
        run: python scripts/frozen_history.py run scripts/replay_source_id_review_repeat.py
      - name: Replay matched source-ID enum fidelity and availability (no calls)
        run: python scripts/frozen_history.py run scripts/replay_source_id_enum_comparison.py
      - name: Replay fresh-source pipeline and measured user demo (no calls)
        run: |
          python scripts/frozen_history.py run scripts/replay_fresh_enum_pipeline.py
          python scripts/frozen_history.py run scripts/demo_fresh_memory.py --person pavo --out fresh-pipeline-demo
      - name: Verify browser choice contract
        # This new protocol uses current source and excludes the unused legacy
        # executor. Existing historical replay steps retain their frozen tree.
        run: python scripts/build_choice_contract.py --check
      - name: Verify single-pass repeat preparation (no model calls)
        run: python -B benchmarks/single-pass-repeat-v1/check.py
      - name: Replay measured single-pass generation repeat (no calls)
        run: python -B scripts/replay_single_pass_repeat.py
      - name: Verify unapproved fresh everyday-decision protocol (no calls)
        run: python -B benchmarks/fresh-decision-v1/check.py
      - name: Replay sealed fresh everyday-decision measurement (no calls)
        run: python -B scripts/replay_fresh_decision.py
      - name: Verify unapproved fixed-card partial-information protocol (no calls)
        run: python -B benchmarks/partial-information-v1/check.py
      - name: Replay sealed fixed-card partial-information results (no calls)
        run: python -B scripts/replay_partial_information.py
      - name: Replay source-accounted choice recovery and regressions (no calls)
        run: python -B scripts/replay_source_accounted.py
      - name: Replay scope-binding omissions and invalid-card denominators (no calls)
        run: python -B scripts/replay_scope_binding.py
      - name: Replay source-bound alias recovery and collateral cases (no calls)
        run: python -B scripts/replay_scope_alias.py
      - name: Verify source-bound alias projection without model inference
        run: python -B benchmarks/scope-alias-encoding-v1/diagnostic.py
      - name: Exercise condition-memory trial without a model
        run: python -B scripts/try_memory.py demo --out condition-memory-trial-demo
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
      - name: Installed demo outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          runaway --version
          runaway demo --out demo
          runaway profile checkout demo/profile.private.json --out editable
          runaway profile export demo/profile.private.json --out exported
          runaway profile compression-plan demo/profile.private.json --budget-chars 600
          python -m runaway distill --input "${{ github.workspace }}/examples/support-sources.synthetic.json" --answer "${{ github.workspace }}/examples/support-answer.synthetic.json" --out tiny-demo
          runaway choices prepare --card tiny-demo/portable.json --questions "${{ github.workspace }}/examples/choice-questions.synthetic.json" --answer-format text
          runaway choices import --questions "${{ github.workspace }}/examples/choice-questions.synthetic.json" --answer "${{ github.workspace }}/examples/choice-answer.synthetic.json" --answer-format text
          runaway choices prepare --card tiny-demo/portable.json --questions "${{ github.workspace }}/examples/choice-questions.synthetic.json" --answer-format text --reader-mode coverage
          runaway choices prepare --card tiny-demo/portable.json --questions "${{ github.workspace }}/examples/choice-questions.synthetic.json" --answer-format text --reader-mode scoped
          runaway choices import --questions "${{ github.workspace }}/examples/choice-questions.synthetic.json" --answer "${{ github.workspace }}/examples/choice-answer.scoped.synthetic.json" --answer-format text --reader-mode scoped
          runaway relayout tiny-demo/profile.private.json --layout rows --out tiny-rows
          runaway relayout tiny-rows/profile.private.json --layout paragraph --out tiny-restored
          python -c "from pathlib import Path; assert Path('tiny-demo/prompt.md').read_bytes() == Path('tiny-restored/prompt.md').read_bytes()"
          runaway distill --format constraints-v2 --input "${{ github.workspace }}/examples/constraints-sources.synthetic.json" --answer "${{ github.workspace }}/examples/constraints-answer.synthetic.json" --budget-chars 512 --out constraints-demo
          runaway export constraints-demo/portable.json
          runaway choices prepare --card constraints-demo/portable.json --questions "${{ github.workspace }}/examples/constraints-questions.synthetic.json" --answer-format text
          runaway distill --format grouped-v1 --input "${{ github.workspace }}/examples/grouped-sources.synthetic.json" --answer "${{ github.workspace }}/examples/grouped-answer.synthetic.json" --budget-chars 512 --out grouped-demo
          runaway export grouped-demo/portable.json
          runaway choices prepare --card grouped-demo/portable.json --questions "${{ github.workspace }}/examples/choice-questions.synthetic.json" --answer-format text
